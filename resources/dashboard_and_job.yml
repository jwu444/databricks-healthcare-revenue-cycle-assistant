# Resource definitions for the Dental Billing Analytics bundle
# Included by databricks.yml via: include: - resources/*.yml

resources:
  # AI/BI Dashboard: Dental Billing Analytics
  # Export the dashboard JSON before first deploy:
#   databricks bundle generate dashboard \
#     --id 01f1a9408503107bba3222274c033e58 \
#     --path ./dashboards/dental_billing.lvdash.json
  dashboards:
    dental_billing:
      display_name: "Dental Billing Analytics"
      file_path: ../dashboards/dental_billing.lvdash.json
      warehouse_id: ${var.warehouse_id}

  # Job: Load all 20 bronze tables from CSV files in the volume
  # Runs notebook Step_5_05_Loop_All_Files_Automated to create/refresh all tables
  jobs:
    bronze_loader:
      name: "Load Bronze Tables"
      description: "Loads all 20 dental billing CSV files into bronze Delta tables."
      schedule:
        quartz_cron_expression: "0 0 6 ? * MON"  # Weekly on Monday at 6 AM
        timezone_id: America/Los_Angeles
        pause_status: UNPAUSED
      email_notifications:
        on_failure:
          - ${DATABRICKS_USER_EMAIL}
      tasks:
        - task_key: load_bronze_tables
          description: "Run the automated bronze loader notebook"
          notebook_task:
            notebook_path: /Workspace/Users/binwu247@gmail.com/project-3/hands_on_project_1/Step_5_05_Loop_All_Files_Automated
            source: WORKSPACE
          job_cluster_key: job_cluster
      job_clusters:
        - job_cluster_key: job_cluster
          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: i3.xlarge
            data_security_mode: SINGLE_USER
            num_workers: 1
            autoscale:
              min_workers: 1
              max_workers: 2

  # Job: Build silver layer from bronze tables
  # Runs notebook Step_8_Silver_Layer_Cleaning to clean and enrich all 20 tables
    silver_layer:
      name: "Build Silver Layer"
      description: "Cleans and enriches 20 bronze tables into silver layer with standardized text, null handling, and derived columns."
      tasks:
        - task_key: build_silver_tables
          description: "Run the silver layer cleaning notebook"
          notebook_task:
            notebook_path: /Workspace/Users/binwu247@gmail.com/project-3/hands_on_project_1/Step_8_Silver_Layer_Cleaning
            source: WORKSPACE
          job_cluster_key: job_cluster
      job_clusters:
        - job_cluster_key: job_cluster
          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: i3.xlarge
            data_security_mode: SINGLE_USER
            num_workers: 1
            autoscale:
              min_workers: 1
              max_workers: 2

  # Job: Build gold layer from silver tables
  # Runs notebook Step_9_Gold_Layer_Analytics to create 8 aggregate tables
    gold_layer:
      name: "Build Gold Layer"
      description: "Builds 8 aggregated gold tables from silver layer for dashboard consumption."
      tasks:
        - task_key: build_gold_tables
          description: "Run the gold layer analytics notebook"
          notebook_task:
            notebook_path: /Workspace/Users/binwu247@gmail.com/project-3/hands_on_project_1/Step_9_Gold_Layer_Analytics
            source: WORKSPACE
          job_cluster_key: job_cluster
      job_clusters:
        - job_cluster_key: job_cluster
          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: i3.xlarge
            data_security_mode: SINGLE_USER
            num_workers: 1
            autoscale:
              min_workers: 1
              max_workers: 2
